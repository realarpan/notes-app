{% extends "base.html" %}
{% block content %}

<div id="appRoot" class="min-h-screen flex bg-[#0b0b0c] text-white transition">

<!-- 🌌 PREMIUM BACKGROUND -->
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="gradient-bg"></div>
</div>

<!-- LEFT PANEL -->
<div class="hidden md:flex w-[55%] items-center px-20">

    <div>
        <h1 class="text-5xl font-semibold leading-tight mb-6 tracking-tight">
            Welcome back.
        </h1>

        <p class="text-gray-400 text-sm max-w-md leading-relaxed">
            Fast. Minimal. Secure.  
            Your academic workspace designed for performance and simplicity.
        </p>

        <!-- Device Info -->
        <div class="mt-12 text-xs text-gray-500 space-y-1">
            <p>Device: <span id="deviceType"></span></p>
            <p>Browser: <span id="browserType"></span></p>
        </div>
    </div>

</div>

<!-- RIGHT LOGIN -->
<div class="flex-1 flex items-center justify-center px-6">

<div id="loginCard"
class="w-full max-w-md p-8 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl shadow-[0_10px_40px_rgba(0,0,0,0.6)] transition">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8">

    <div>
        <h2 class="text-xl font-semibold tracking-tight">Sign in</h2>
        <p class="text-xs text-gray-500">Access your dashboard</p>
    </div>

    <!-- 🌗 Toggle -->
    <button onclick="toggleTheme()"
    class="text-xs px-3 py-1.5 rounded-md border border-white/10 hover:bg-white/10 transition">
    Change Mode
    </button>

</div>

<form method="POST" id="loginForm" class="space-y-5">

    <!-- Username -->
    <div class="relative">
        <input name="username" required
        class="input"
        placeholder="Username">
        <label class="label">Username</label>
    </div>

    <!-- Password -->
    <div class="relative">
        <input type="password" name="password" id="password" required
        class="input pr-10"
        placeholder="Password"
        onkeyup="checkCaps(event)">

        <label class="label">Password</label>

        <button type="button" onclick="togglePassword()"
        class="absolute right-3 top-3 text-gray-500 hover:text-white">
        👁️
        </button>
    </div>

    <p id="capsWarning" class="text-xs text-yellow-400 hidden">
        Caps Lock is ON
    </p>

    <!-- BUTTON -->
    <button id="loginBtn"
    class="btn-primary">

        <span id="btnText">Sign in</span>

        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="none" opacity="0.3"/>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="white" stroke-width="3"/>
        </svg>
    </button>

</form>

<!-- FOOTER -->
<div class="mt-6 flex justify-between text-xs text-gray-500">
<span>Secure login</span>
<span id="timeNow"></span>
</div>

</div>
</div>
</div>

<!-- 🎨 STYLE -->
<style>

/* 🌌 Background */
.gradient-bg{
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(168,85,247,0.12), transparent 40%),
radial-gradient(circle at 50% 50%, rgba(59,130,246,0.08), transparent 60%);
animation: move 30s linear infinite;
}

@keyframes move{
0%{ transform: translate(0,0); }
50%{ transform: translate(-6%, -6%); }
100%{ transform: translate(0,0); }
}

/* Inputs */
.input{
width:100%;
padding:12px;
background:#0f0f10;
border:1px solid rgba(255,255,255,0.08);
border-radius:10px;
outline:none;
transition:0.25s;
color:white;
}

.input:focus{
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.2);
background:#141416;
}

/* Floating label */
.label{
position:absolute;
left:12px;
top:12px;
font-size:13px;
color:#6b7280;
transition:0.2s;
pointer-events:none;
}

.input:focus + .label,
.input:not(:placeholder-shown) + .label{
top:-8px;
font-size:10px;
color:#a5b4fc;
}

/* Button */
.btn-primary{
width:100%;
padding:12px;
border-radius:10px;
background:linear-gradient(135deg, #6366f1, #8b5cf6);
font-weight:500;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
transition:0.3s;
}

.btn-primary:hover{
opacity:0.9;
transform:translateY(-1px);
box-shadow:0 10px 25px rgba(99,102,241,0.3);
}

/* Light Mode */
.light{
background:#f9fafb !important;
color:#111 !important;
}

.light #loginCard{
background:white !important;
color:black !important;
border:1px solid #e5e7eb;
}

.light .input{
background:#f3f4f6;
color:black;
}

</style>

<!-- ⚡ JS -->
<script>

// Theme
function toggleTheme(){
const root = document.getElementById("appRoot");
root.classList.toggle("light");
localStorage.setItem("theme", root.classList.contains("light") ? "light":"dark");
}

// Load
window.onload = function(){

if(localStorage.getItem("theme")==="light"){
document.getElementById("appRoot").classList.add("light");
}

// Device
const ua = navigator.userAgent;
document.getElementById("deviceType").innerText =
/Mobi|Android/i.test(ua) ? "Mobile" : "Desktop";

document.getElementById("browserType").innerText =
ua.includes("Chrome") ? "Chrome" :
ua.includes("Firefox") ? "Firefox" :
ua.includes("Safari") ? "Safari" : "Browser";

// Error
const hasError = {{ 'true' if get_flashed_messages() else 'false' }};
if(hasError){
document.getElementById("loginCard").classList.add("shake");
}
};

// Password
function togglePassword(){
const p = document.getElementById("password");
p.type = p.type === "password" ? "text" : "password";
}

// Caps
function checkCaps(e){
document.getElementById("capsWarning")
.classList.toggle("hidden", !e.getModifierState("CapsLock"));
}

// Loading
document.getElementById("loginForm").addEventListener("submit", ()=>{
document.getElementById("btnText").innerText = "Signing in...";
document.getElementById("spinner").classList.remove("hidden");
});

// Time
setInterval(()=>{
const now = new Date();
document.getElementById("timeNow").innerText =
now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
},1000);

</script>

{% endblock %}
