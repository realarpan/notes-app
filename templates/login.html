{% extends "base.html" %}
{% block content %}

<div id="appRoot" class="min-h-screen flex bg-[#0c0d10] text-white">

<!-- 🌌 BACKGROUND -->
<div class="fixed inset-0 -z-10">
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
</div>

<!-- LEFT -->
<div class="hidden md:flex w-[55%] items-center px-20">

    <div>
        <h1 class="text-6xl font-semibold mb-6 tracking-tight">
            Welcome back.
        </h1>

        <p class="text-gray-400 text-base max-w-md leading-relaxed">
            A fast, minimal and secure platform to manage your academic workflow with clarity and precision.
        </p>

        <div class="mt-12 text-sm text-gray-400 space-y-2">
            <p>💻 Device: <span id="deviceType" class="text-white"></span></p>
            <p>🌐 Browser: <span id="browserType" class="text-white"></span></p>
        </div>
    </div>

</div>

<!-- RIGHT -->
<div class="flex-1 flex items-center justify-center px-6">

<div id="loginCard"
class="w-full max-w-md p-8 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl shadow-2xl">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8">
    <div>
        <h2 class="text-2xl font-semibold">Sign in</h2>
        <p class="text-sm text-gray-400">Access your dashboard</p>
    </div>

    <button onclick="toggleTheme()"
    class="text-xs px-3 py-1.5 rounded-md border border-white/10 hover:bg-white/10">
    Theme
    </button>
</div>

<form method="POST" id="loginForm" class="space-y-5">

    <!-- Username -->
    <div class="input-group">
        <input name="username" required placeholder=" "
        class="input">
        <label>Username</label>
    </div>

    <!-- Password -->
    <div class="input-group">
        <input type="password" name="password" id="password" required placeholder=" "
        class="input pr-10"
        onkeyup="checkCaps(event)">
        <label>Password</label>

        <button type="button" onclick="togglePassword()"
        class="absolute right-3 top-3 text-gray-400 hover:text-white">
        👁️
        </button>
    </div>

    <p id="capsWarning" class="text-xs text-yellow-400 hidden">
        Caps Lock is ON
    </p>

    <!-- BUTTON -->
    <button id="loginBtn" class="btn-primary">
        <span id="btnText">Sign in</span>

        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="none" opacity="0.3"/>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="white" stroke-width="3"/>
        </svg>
    </button>

</form>

<!-- FOOTER -->
<div class="mt-6 flex justify-between text-xs text-gray-500">
<span>Secure login</span>
<span id="timeNow"></span>
</div>

</div>
</div>
</div>

<!-- 🎨 STYLE -->
<style>

/* Background */
.bg-gradient{
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(168,85,247,0.12), transparent 40%);
animation: move 25s linear infinite;
}

.grid-overlay{
position:absolute;
width:100%;
height:100%;
background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size: 40px 40px;
}

@keyframes move{
0%{ transform: translate(0,0); }
50%{ transform: translate(-5%, -5%); }
100%{ transform: translate(0,0); }
}

/* Inputs */
.input-group{
position:relative;
}

.input{
width:100%;
padding:14px;
background:#111216;
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
color:white;
outline:none;
transition:0.25s;
}

.input:focus{
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.2);
background:#16181d;
}

/* Floating label FIXED */
.input-group label{
position:absolute;
left:14px;
top:14px;
color:#6b7280;
font-size:13px;
transition:0.2s;
pointer-events:none;
}

.input:focus + label,
.input:not(:placeholder-shown) + label{
top:-8px;
font-size:10px;
color:#a5b4fc;
}

/* Button */
.btn-primary{
width:100%;
padding:14px;
border-radius:12px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
font-weight:500;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
transition:0.3s;
}

.btn-primary:hover{
transform:translateY(-1px);
box-shadow:0 10px 30px rgba(99,102,241,0.3);
}

/* Light Mode */
.light{
background:#f9fafb !important;
color:#111 !important;
}

.light #loginCard{
background:white !important;
color:black !important;
border:1px solid #e5e7eb;
}

</style>

<!-- ⚡ JS -->
<script>

// Theme
function toggleTheme(){
const root = document.getElementById("appRoot");
root.classList.toggle("light");
localStorage.setItem("theme", root.classList.contains("light") ? "light":"dark");
}

// Load
window.onload = function(){

if(localStorage.getItem("theme")==="light"){
document.getElementById("appRoot").classList.add("light");
}

// Device detect
const ua = navigator.userAgent;
document.getElementById("deviceType").innerText =
/Mobi|Android/i.test(ua) ? "Mobile" : "Desktop";

document.getElementById("browserType").innerText =
ua.includes("Chrome") ? "Chrome" :
ua.includes("Firefox") ? "Firefox" :
ua.includes("Safari") ? "Safari" : "Browser";

// Error shake
const hasError = {{ 'true' if get_flashed_messages() else 'false' }};
if(hasError){
document.getElementById("loginCard").classList.add("shake");
}
};

// Toggle password
function togglePassword(){
const p = document.getElementById("password");
p.type = p.type === "password" ? "text" : "password";
}

// Caps
function checkCaps(e){
document.getElementById("capsWarning")
.classList.toggle("hidden", !e.getModifierState("CapsLock"));
}

// Loading
document.getElementById("loginForm").addEventListener("submit", ()=>{
document.getElementById("btnText").innerText = "Signing in...";
document.getElementById("spinner").classList.remove("hidden");
});

// Time
setInterval(()=>{
const now = new Date();
document.getElementById("timeNow").innerText =
now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
},1000);

</script>

{% endblock %}
