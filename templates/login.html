{% extends "base.html" %}
{% block content %}

<div id="appRoot" class="min-h-screen flex flex-col md:flex-row overflow-x-hidden bg-[#0c0d10] text-white">

<!-- BACKGROUND -->
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
</div>

<!-- LEFT PANEL -->
<div class="hidden md:flex w-1/2 items-center px-10 lg:px-20">
    <div>
        <h1 class="text-4xl lg:text-6xl font-semibold mb-6 tracking-tight">
            Welcome back.
        </h1>
        <p class="text-gray-400 text-sm lg:text-base max-w-md leading-relaxed">
            Fast, minimal and secure platform to manage your academic workflow with clarity.
        </p>
    </div>
</div>

<!-- RIGHT PANEL -->
<div class="flex-1 flex items-center justify-center px-4 sm:px-6">

<div id="loginCard"
class="w-full max-w-md p-6 sm:p-8 rounded-2xl bg-white/5 border border-white/10 backdrop-blur-xl shadow-2xl">

<!-- HEADER -->
<div class="flex justify-between items-center mb-6">
    <div>
        <h2 class="text-xl sm:text-2xl font-semibold">Sign in</h2>
        <p class="text-xs sm:text-sm text-gray-400">Access your dashboard</p>
    </div>

    <button onclick="toggleTheme()"
    class="text-xs px-2.5 py-1.5 rounded-md border border-white/10 hover:bg-white/10">
    Change Mode
    </button>
</div>

<!-- FORM -->
<form method="POST" id="loginForm" class="space-y-4">

    <div class="input-group">
        <input name="username" required placeholder=" " class="input">
        <label>Username</label>
    </div>

    <div class="input-group">
        <input type="password" name="password" id="password" required placeholder=" "
        class="input pr-10" onkeyup="checkCaps(event)">
        <label>Password</label>

        <button type="button" onclick="togglePassword()"
        class="absolute right-3 top-3 text-gray-400 hover:text-white text-xs">
        View
        </button>
    </div>

    <p id="capsWarning" class="text-xs text-yellow-400 hidden">
        Caps Lock is ON
    </p>

    <button id="loginBtn" class="btn-primary">
        <span id="btnText">Sign in</span>

        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="none" opacity="0.3"/>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="white" stroke-width="3"/>
        </svg>
    </button>

</form>

<!-- STATUS BAR -->
<div class="mt-5">

    <div class="status-bar-clean flex-col sm:flex-row">

        <!-- Combined pill -->
        <div class="pill-combined flex-wrap justify-center sm:justify-start">
            <span id="deviceType"></span>
            <span class="dot-sep"></span>
            <span id="browserType"></span>
            <span class="dot-sep"></span>
            <span id="locationText">Detecting...</span>
        </div>

        <!-- Ping -->
        <div class="flex items-center justify-center sm:justify-end gap-2 text-xs text-gray-400 mt-2 sm:mt-0">
            <span class="live-dot"></span>
            <span id="pingText">-- ms</span>
        </div>

    </div>

</div>

</div>
</div>

</div>

<!-- STYLE -->
<style>

/* Prevent scroll */
html, body{
overflow-x:hidden;
}

/* BACKGROUND */
.bg-gradient{
position:absolute;
width:150%;
height:150%;
background:
radial-gradient(circle at 20% 30%, rgba(99,102,241,0.15), transparent 40%),
radial-gradient(circle at 80% 70%, rgba(168,85,247,0.12), transparent 40%);
animation: move 25s linear infinite;
}

.grid-overlay{
position:absolute;
width:100%;
height:100%;
background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size: 40px 40px;
}

@keyframes move{
0%{ transform: translate(0,0); }
50%{ transform: translate(-5%, -5%); }
100%{ transform: translate(0,0); }
}

/* INPUTS */
.input-group{ position:relative; }

.input{
width:100%;
padding:12px;
background:#111216;
border:1px solid rgba(255,255,255,0.08);
border-radius:10px;
color:white;
outline:none;
}

.input:focus{
border-color:#6366f1;
box-shadow:0 0 0 2px rgba(99,102,241,0.2);
background:#16181d;
}

.input-group label{
position:absolute;
left:12px;
top:12px;
color:#6b7280;
font-size:12px;
transition:0.2s;
}

.input:focus + label,
.input:not(:placeholder-shown) + label{
top:-7px;
font-size:10px;
color:#a5b4fc;
}

/* BUTTON */
.btn-primary{
width:100%;
padding:12px;
border-radius:10px;
background:linear-gradient(135deg,#6366f1,#8b5cf6);
font-weight:500;
display:flex;
justify-content:center;
align-items:center;
gap:8px;
}

.btn-primary:hover{
box-shadow:0 10px 25px rgba(99,102,241,0.3);
}

/* STATUS BAR */
.status-bar-clean{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;

padding:10px;
border-radius:12px;

background:rgba(255,255,255,0.04);
border:1px solid rgba(255,255,255,0.08);
backdrop-filter: blur(12px);
}

/* Combined pill */
.pill-combined{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap;

padding:6px 12px;
border-radius:999px;

background:rgba(99,102,241,0.12);
border:1px solid rgba(99,102,241,0.25);

font-size:11px;
}

/* Dot */
.dot-sep{
width:4px;
height:4px;
border-radius:50%;
background:#6b7280;
}

/* Live dot */
.live-dot{
width:7px;
height:7px;
border-radius:50%;
background:#22c55e;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%{opacity:1;}
50%{opacity:0.4;}
100%{opacity:1;}
}

/* LIGHT MODE */
.light{
background:#f9fafb !important;
color:#111 !important;
}

.light #loginCard{
background:white !important;
color:black !important;
}

</style>

<!-- JS -->
<script>

document.addEventListener("DOMContentLoaded", () => {

    window.toggleTheme = function(){
        document.getElementById("appRoot").classList.toggle("light");
    };

    const ua = navigator.userAgent;

    document.getElementById("deviceType").innerText =
        /Mobi|Android/i.test(ua) ? "Mobile" : "Desktop";

    document.getElementById("browserType").innerText =
        ua.includes("Chrome") ? "Chrome" :
        ua.includes("Firefox") ? "Firefox" :
        ua.includes("Safari") ? "Safari" : "Browser";

    fetch("https://ipapi.co/json/")
    .then(res => res.json())
    .then(data => {
        document.getElementById("locationText").innerText =
            `${data.city}, ${data.country_name}`;
    })
    .catch(()=>{
        document.getElementById("locationText").innerText = "Unknown";
    });

    async function ping(){
        const start = performance.now();
        try{
            await fetch("/", {method:"HEAD"});
            const ms = Math.round(performance.now() - start);
            document.getElementById("pingText").innerText = ms + " ms";
        }catch{
            document.getElementById("pingText").innerText = "offline";
        }
    }

    ping();
    setInterval(ping, 5000);

    window.togglePassword = function(){
        const p = document.getElementById("password");
        p.type = p.type === "password" ? "text" : "password";
    };

    window.checkCaps = function(e){
        document.getElementById("capsWarning")
        .classList.toggle("hidden", !e.getModifierState("CapsLock"));
    };

    document.getElementById("loginForm").addEventListener("submit", ()=>{
        document.getElementById("btnText").innerText = "Signing in...";
        document.getElementById("spinner").classList.remove("hidden");
    });

});

</script>

{% endblock %}
