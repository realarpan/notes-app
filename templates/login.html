{% extends "base.html" %}
{% block content %}

<div id="appRoot" class="min-h-screen flex bg-[#0a0a0a] text-white transition">

<!-- 🌊 Subtle Background -->
<div class="fixed inset-0 -z-10 overflow-hidden">
    <div class="wave"></div>
    <div class="wave2"></div>
</div>

<!-- LEFT -->
<div class="hidden md:flex w-[55%] items-center px-16">

    <div>
        <h1 class="text-5xl font-semibold leading-tight mb-6">
            Welcome Back<br>
        </h1>

        <p class="text-gray-400 text-sm max-w-md">
            A minimal, fast and secure platform to manage and access your academic content seamlessly.
        </p>

        <!-- Device info only -->
        <div class="mt-10 text-xs text-gray-500 space-y-1">
            <p>Device: <span id="deviceType"></span></p>
            <p>Browser: <span id="browserType"></span></p>
        </div>

    </div>

</div>

<!-- RIGHT -->
<div class="flex-1 flex items-center justify-center px-6">

<div id="loginCard"
class="w-full max-w-md p-8 rounded-2xl bg-[#111111]/80 border border-white/10 backdrop-blur-xl shadow-[0_0_40px_rgba(0,0,0,0.6)] transition">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8">

    <div>
        <h2 class="text-xl font-semibold tracking-tight">Sign in</h2>
        <p class="text-xs text-gray-500">Continue to dashboard</p>
    </div>

    <!-- 🌗 Toggle -->
    <button onclick="toggleTheme()"
    class="text-xs px-3 py-1.5 rounded-md border border-white/10 hover:bg-white/10 transition">
    Change Mode
    </button>

</div>

<form method="POST" id="loginForm" class="space-y-5">

    <!-- Username -->
    <div class="relative">
        <input name="username" required
        class="peer w-full p-3 bg-[#0f0f0f] border border-white/10 rounded-lg outline-none focus:border-white/30 focus:bg-[#141414] transition placeholder-transparent"
        placeholder="Username">

        <label class="absolute left-3 top-3 text-gray-500 text-sm transition-all
        peer-placeholder-shown:top-3
        peer-focus:-top-2 peer-focus:text-xs
        peer-valid:-top-2 peer-valid:text-xs">
        Username
        </label>
    </div>

    <!-- Password -->
    <div class="relative">
        <input type="password" name="password" id="password" required
        class="peer w-full p-3 pr-10 bg-[#0f0f0f] border border-white/10 rounded-lg outline-none focus:border-white/30 focus:bg-[#141414] transition placeholder-transparent"
        placeholder="Password"
        onkeyup="checkCaps(event)">

        <label class="absolute left-3 top-3 text-gray-500 text-sm transition-all
        peer-placeholder-shown:top-3
        peer-focus:-top-2 peer-focus:text-xs
        peer-valid:-top-2 peer-valid:text-xs">
        Password
        </label>

        <button type="button" onclick="togglePassword()"
        class="absolute right-3 top-3 text-gray-500 hover:text-white">
        👁️
        </button>
    </div>

    <p id="capsWarning" class="text-xs text-yellow-400 hidden">
        Caps Lock is ON
    </p>

    <!-- BUTTON -->
    <button id="loginBtn"
    class="w-full py-3 rounded-lg font-medium bg-white text-black hover:bg-gray-200 transition flex justify-center items-center gap-2">

        <span id="btnText">Sign in</span>

        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="black" stroke-width="3" fill="none" opacity="0.3"/>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="black" stroke-width="3"/>
        </svg>
    </button>

</form>

<!-- FOOTER -->
<div class="mt-6 flex justify-between text-xs text-gray-500">
<span>Secure login</span>
<span id="timeNow"></span>
</div>

</div>
</div>
</div>

<!-- 🌊 BACKGROUND -->
<style>
.wave, .wave2{
position:absolute;
width:200%;
height:200%;
background:
radial-gradient(circle at 30% 30%, rgba(59,130,246,0.12), transparent 40%),
radial-gradient(circle at 70% 70%, rgba(168,85,247,0.12), transparent 40%);
animation: move 25s linear infinite;
}

.wave2{
animation-duration: 40s;
opacity:0.5;
}

@keyframes move{
0%{ transform: translate(0,0); }
50%{ transform: translate(-8%, -8%); }
100%{ transform: translate(0,0); }
}

/* LIGHT MODE (FIXED PROPERLY) */
.light{
background:#f8fafc !important;
color:#111 !important;
}
.light #loginCard{
background:white !important;
color:black !important;
border:1px solid #e5e7eb;
}
</style>

<!-- JS -->
<script>

// Theme
function toggleTheme(){
const root = document.getElementById("appRoot");
root.classList.toggle("light");
localStorage.setItem("theme", root.classList.contains("light") ? "light":"dark");
}

// Load
window.onload = function(){

if(localStorage.getItem("theme")==="light"){
document.getElementById("appRoot").classList.add("light");
}

// Device
const ua = navigator.userAgent;
document.getElementById("deviceType").innerText =
/Mobi|Android/i.test(ua) ? "Mobile" : "Desktop";

document.getElementById("browserType").innerText =
ua.includes("Chrome") ? "Chrome" :
ua.includes("Firefox") ? "Firefox" :
ua.includes("Safari") ? "Safari" : "Browser";

// Error
const hasError = {{ 'true' if get_flashed_messages() else 'false' }};
if(hasError){
document.getElementById("loginCard").classList.add("shake");
}
};

// Password
function togglePassword(){
const p = document.getElementById("password");
p.type = p.type === "password" ? "text" : "password";
}

// Caps
function checkCaps(e){
document.getElementById("capsWarning")
.classList.toggle("hidden", !e.getModifierState("CapsLock"));
}

// Loading
document.getElementById("loginForm").addEventListener("submit", ()=>{
document.getElementById("btnText").innerText = "Signing in...";
document.getElementById("spinner").classList.remove("hidden");
});

// Time
setInterval(()=>{
const now = new Date();
document.getElementById("timeNow").innerText =
now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
},1000);

</script>

{% endblock %}
