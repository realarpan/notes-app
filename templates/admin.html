{% extends "base.html" %}
{% block content %}

<div class="max-w-5xl mx-auto mt-10 px-4">

<!-- HEADER -->
<div class="flex justify-between items-center mb-8">
    <div>
        <h2 class="text-3xl font-semibold tracking-tight">Admin Panel</h2>
        <p class="text-gray-400 text-sm mt-1">
            Upload and manage notes securely
        </p>
    </div>

    <div class="text-sm text-gray-400">
        Logged in as 
        <span class="text-white font-medium capitalize">
            {{ current_user.username }}
        </span>
    </div>
</div>

<!-- MAIN CARD -->
<div class="bg-white/5 backdrop-blur-xl p-8 rounded-2xl border border-white/10 shadow-2xl">

<form method="POST" enctype="multipart/form-data" id="uploadForm">

    <!-- CLASS SELECT -->
    <label class="text-sm text-gray-400 mb-2 block">Select Class</label>
    <select name="class_number"
        class="w-full mb-6 p-3 rounded-lg bg-gray-800/80 text-white focus:ring-2 focus:ring-blue-500 outline-none">
        
        {% for i in range(1,12) %}
        <option value="{{i}}">Class {{i}}</option>
        {% endfor %}
    </select>

    <!-- FILE UPLOAD BOX -->
    <label class="text-sm text-gray-400 mb-2 block">Upload PDF</label>

    <div id="dropArea"
        class="border-2 border-dashed border-white/20 rounded-xl p-6 text-center hover:border-blue-500/40 transition cursor-pointer bg-gray-900/40">

        <p class="text-gray-400 text-sm mb-2">
            Drag & drop PDF here or click to browse
        </p>

        <input type="file" name="file" id="fileInput" accept="application/pdf"
            class="hidden">

        <button type="button" onclick="document.getElementById('fileInput').click()"
            class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm mt-2">
            Choose File
        </button>

        <p id="fileName" class="text-green-400 text-sm mt-3 hidden"></p>
    </div>

    <!-- BUTTON -->
    <button id="uploadBtn"
        class="w-full mt-6 bg-green-600 hover:bg-green-700 py-3 rounded-xl font-medium flex justify-center items-center gap-2 transition shadow-lg shadow-green-600/20">

        <span id="btnText">Upload PDF</span>

        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke="white" stroke-width="3" fill="none" opacity="0.3"/>
            <path d="M22 12a10 10 0 0 1-10 10" stroke="white" stroke-width="3"/>
        </svg>

    </button>

</form>

</div>

</div>

<!-- 🔥 SCRIPT -->
<script>
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const dropArea = document.getElementById("dropArea");

// FILE SELECT
fileInput.addEventListener("change", function() {
    if (this.files.length > 0) {
        fileName.innerText = "Selected: " + this.files[0].name;
        fileName.classList.remove("hidden");
    }
});

// DRAG & DROP
dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.classList.add("border-blue-500");
});

dropArea.addEventListener("dragleave", () => {
    dropArea.classList.remove("border-blue-500");
});

dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;

    if (fileInput.files.length > 0) {
        fileName.innerText = "Selected: " + fileInput.files[0].name;
        fileName.classList.remove("hidden");
    }

    dropArea.classList.remove("border-blue-500");
});

// LOADING STATE
document.getElementById("uploadForm").addEventListener("submit", function() {
    const btn = document.getElementById("uploadBtn");
    const text = document.getElementById("btnText");
    const spinner = document.getElementById("spinner");

    btn.disabled = true;
    text.innerText = "Uploading...";
    spinner.classList.remove("hidden");
});
</script>

{% endblock %}
